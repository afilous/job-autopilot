name: Job Autopilot - Discover Funded Startups

# Finds startups that just raised seed / pre-seed / Series A-B from funding news,
# finds their job boards, and adds them to the daily ATS scan. Runs just before
# the ATS discovery (16:00 UTC) so a new board is scanned the same day.
# Free: uses the same free search credits as the web-search workflow.

on:
  schedule:
    - cron: "45 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print what was found, write nothing to Supabase'
        required: false
        default: false
        type: boolean
      mode:
        description: 'news = recent funding headlines, backfill = past year by sector, enrich = funding stage of companies already in the job list'
        required: false
        default: 'news'
        type: choice
        options: [news, backfill, enrich]
      search_window:
        description: 'Window for news mode: d, w, m (backfill uses y, enrich uses any time unless set)'
        required: false
        default: ''
      max_lookups:
        description: 'Max companies to look up job boards for'
        required: false
        default: '40'

jobs:
  discover-funded:
    name: Discover funded startups
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install

      - name: Run funded-startup discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MODE: ${{ github.event.inputs.mode || 'news' }}
          SEARCH_WINDOW: ${{ github.event.inputs.search_window }}
          MAX_LOOKUPS: ${{ github.event.inputs.max_lookups || '40' }}
        run: node discover-funded-startups.js

      # Scheduled runs also check the funding stage of ~40 companies from your job list
      # each day (so older raises are covered), and a manual 'news' run does too.
      - name: Enrich funding stage for companies in the job list
        if: ${{ github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          MODE: enrich
          MAX_LOOKUPS: '40'
        run: node discover-funded-startups.js
