name: Job Autopilot — Weekly Cleanup

on:
  schedule:
    - cron: '0 8 * * 0'  # Every Sunday 8am UTC (midnight PT)
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: Clean up old records and update polling tiers

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # FIX: the script below requires @supabase/supabase-js but nothing ever
      # installed it, so every run died with MODULE_NOT_FOUND.
      - name: Install dependency
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js@2

      - name: Run cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_ANON_KEY);

          async function cleanup() {
            // Delete old archived/duplicate rows. Rows classified apply/review are never deleted.
            const { error: e1, count: c1 } = await supabase
              .from('applications')
              .delete({ count: 'exact' })
              .in('status', ['archived', 'duplicate'])
              .lt('created_at', new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString());
            console.log('Deleted old archived/duplicate:', c1, e1 ? e1.message : '');

            // Reset failed jobs for retry (exclude manual companies)
            const { error: e2, count: c2 } = await supabase
              .from('applications')
              .update({ status: 'queued', notes: null }, { count: 'exact' })
              .eq('status', 'failed')
              .not('company', 'in', '(\"Stripe\",\"Databricks\",\"Block\",\"Intuit\",\"Waymo\")');
            console.log('Reset failed jobs:', c2, e2 ? e2.message : '');

            // Polling tiers (optional RPC; ignore if it does not exist)
            try {
              const { error: e3 } = await supabase.rpc('update_polling_tiers');
              if (e3) console.log('update_polling_tiers skipped:', e3.message);
            } catch (e) { console.log('update_polling_tiers skipped:', e.message); }

            console.log('Cleanup complete');
          }

          cleanup().catch(err => { console.error(err); process.exit(1); });
          "
