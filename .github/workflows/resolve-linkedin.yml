name: Job Autopilot - Resolve LinkedIn Jobs

# LinkedIn alert emails only give company + title. This finds the employer's
# own posting (Greenhouse / Ashby / Lever / Workable / SmartRecruiters), swaps
# in the direct apply link and real location, and remembers the company board.

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print matches, write nothing to Supabase'
        required: false
        default: false
        type: boolean
      max_rows:
        description: 'Max LinkedIn rows to attempt this run'
        required: false
        default: '300'

jobs:
  resolve:
    name: Resolve LinkedIn rows to employer postings
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install

      - name: Run resolver
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_ROWS: ${{ github.event.inputs.max_rows || '300' }}
        run: node resolve-linkedin.js
