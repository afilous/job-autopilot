name: Job Autopilot - Discover Jobs (Web Search)

# Searches the ATS job boards (Ashby, Greenhouse, Lever, Workable, SmartRecruiters...)
# for target titles through Bright Data, Tavily, SerpApi and Serper, in that order, using only free credits
# (counted in Supabase view api_quota_status; each stops before its free limit).
# Runs daily on a past-24-hours window (about 480 searches a month on each of
# Tavily and Bright Data, well inside their free limits), so new postings are
# seen the day they appear. Manual runs default to the past week.
# The old Google Custom Search API returns 403 and is being retired.

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print matches, write nothing to Supabase'
        required: false
        default: false
        type: boolean
      search_window:
        description: 'Time window: d = past 24 hours, w = past week, m = past month'
        required: false
        default: 'w'
      queries_per_run:
        description: 'Number of search queries to run'
        required: false
        default: '16'

jobs:
  discover-web:
    name: Discover via web search
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install

      - name: Run web search discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SEARCH_WINDOW: ${{ github.event.inputs.search_window || 'd' }}
          QUERIES_PER_RUN: ${{ github.event.inputs.queries_per_run || '12' }}
        run: node discover-jobs-google.js
