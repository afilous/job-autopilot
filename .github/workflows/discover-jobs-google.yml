name: Job Autopilot - Discover Jobs (Web Search)

# Searches the ATS job boards (Ashby, Greenhouse, Lever, Workable, SmartRecruiters...)
# for target titles through Serper.dev (or SerpApi as a fallback).
# Runs Mon/Wed/Fri with a past-week window, so nothing falls between runs and
# monthly search usage stays low (~156 searches).
# The old Google Custom Search API returns 403 and is being retired.

on:
  schedule:
    - cron: "0 16 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print matches, write nothing to Supabase'
        required: false
        default: false
        type: boolean
      search_window:
        description: 'Time window: d = past 24 hours, w = past week, m = past month'
        required: false
        default: 'w'
      queries_per_run:
        description: 'Number of search queries to run'
        required: false
        default: '12'

jobs:
  discover-web:
    name: Discover via web search
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install

      - name: Run web search discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SEARCH_WINDOW: ${{ github.event.inputs.search_window || 'w' }}
          QUERIES_PER_RUN: ${{ github.event.inputs.queries_per_run || '12' }}
        run: node discover-jobs-google.js
